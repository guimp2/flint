<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ideias Enviadas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @font-face {
  font-family: "OpenAISans";
  src: url("./fonts/OpenAISans-Regular.woff2") format("woff2");
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
</style>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://rupvjadunolkuivnnyud.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1cHZqYWR1bm9sa3Vpdm5ueXVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM3MDg5MTMsImV4cCI6MjA2OTI4NDkxM30.Rl0INy4YFZd4rGt9mtaZjsv_vCicF5kkHSNaPMC_WlY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function carregarIdeias() {
      const { data, error } = await supabase.from('ideias').select('*').order('created_at', { ascending: false });

      const output = document.getElementById('saida');
      if (error) {
        output.textContent = 'Erro ao carregar ideias: ' + error.message;
        console.error(error);
        return;
      }

      output.textContent = JSON.stringify(data, null, 2);
    }

    window.addEventListener('DOMContentLoaded', carregarIdeias);
  </script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow">
          <div class="card-body">
            <h1 class="card-title text-center mb-4">Ideias Enviadas</h1>
            <pre id="saida" class="bg-dark text-light p-3 rounded" style="height: 400px; overflow-y: auto; font-size: 0.9rem;">Carregando...</pre>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
